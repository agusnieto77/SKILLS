name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --select F,E9,B --line-length 140

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: zotero-citations
        working-directory: zotero-citations
        run: python -m unittest discover -s tests -v
      - name: wp-api
        working-directory: wp-api
        run: |
          python -m pip install "requests>=2.31,<3"
          python -m unittest discover -s assets -p test_wp_api.py -v
          python validation/test_scenarios.py
      - name: youtube-api
        working-directory: youtube-api
        run: python validation/test_yt_datos.py
      - name: sigeva-bd
        working-directory: sigeva-bd
        shell: bash
        # Chromium for the end-to-end tests against the local SIGEVA simulator (no network, no credentials).
        run: |
          python -m pip install -r assets/requirements.txt
          if [ "$RUNNER_OS" = "Linux" ]; then python -m playwright install --with-deps chromium; else python -m playwright install chromium; fi
          python validation/test_sigeva_bd.py

  test-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: tweetscraper
        working-directory: tweetscraper
        # --ignore-scripts skips the Chromium download: the tests never launch a browser.
        run: npm ci --ignore-scripts && npm test
